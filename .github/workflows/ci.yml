name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - run: gofmt -w $(find . -name '*.go' -not -path './vendor/*')
      - run: go test ./...
      - run: go vet ./...
      - run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agy ./cmd/agy
      - uses: actions/upload-artifact@v4
        with:
          name: agy-linux-amd64
          path: dist/agy
