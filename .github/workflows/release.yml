name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Format, test and vet
        run: |
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
          go test ./...
          go vet ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agy ./cmd/agy
          ./dist/agy --version
          file dist/agy
          ldd dist/agy 2>&1 | grep -q "not a dynamic executable"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-linux-amd64
          path: dist/agy

      - name: Read release version
        id: release_version
        run: |
          version=$(grep -Eo 'const version = "[^"]+"' cmd/agy/main.go | cut -d'"' -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: agy-open v${{ steps.release_version.outputs.version }}
          body: |
            agy-open v0.8.3 is an independent terminal-first AI coding agent for Linux, written in Go.

            Highlights:
            - NVIDIA RPM and TPM limits are editable as the first entries in /config; a shared sliding-window limiter and bounded FIFO queue coordinate all Agy NVIDIA workers.
            - NVIDIA Retry-After handling, a TUI retry-on-429 switch, configurable maximum backoff, and a shared circuit pause reduce repeated 429 bursts.
            - TUI shell command rows preserve actual multiline scripts; terminal escape sequences remain safely rendered as visible text.
            - Agent requests encourage batching independent inspections and stop identical repeated tool calls before re-execution.
            - Ten isolated providers: Google Antigravity OAuth, Gemini Developer API, Google AI Studio, Gemini Live, ChatGPT OAuth, OpenAI API, OpenAI-compatible local servers, OpenRouter, Groq, and NVIDIA API Catalog.
            - Gemini Developer API and AI Studio use the v1beta Interactions API with Gemini 3.8 Flash, native Code Execution, Google Search, URL Context, configured safety settings, and resumable local interaction history.
            - Gemini Live uses the required bidirectional Live API WebSocket transport; Live models are never sent to GenerateContent or Chat Completions.
            - One saved Google API key is shared by Gemini Developer API, AI Studio, and Gemini Live.
            - API-key changes in the TUI immediately refresh the active provider client; model discovery and inference use the saved key without a restart or duplicate login.
            - Groq API provider with live model discovery, namespaced groq:model-id selections, and Qwen 3.8 reasoning-effort mapping.
            - NVIDIA API Catalog provider with dedicated NVIDIA_API_KEY credentials, live /v1/models discovery, and namespaced nvidia:model-id selections.
            - OpenRouter model discovery and inference use the saved API key from the TUI credential manager.
            - Interactive TUI scheduler, natural-language agent-role generation, teamwork planning, and unlimited-by-default execution budgets.
            - Static Linux amd64 binary; model inference remains remote.

            Authentication:
            - Use /login for OAuth providers.
            - Save API keys in /config → Provider credentials, or provide them with agy login PROVIDER --with-api-key.
            - Keys are never embedded in the binary.
          files: dist/agy
          generate_release_notes: true
          prerelease: false
