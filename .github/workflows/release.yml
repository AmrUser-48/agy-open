name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Windows 10+ builds use the current Go toolchain.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
      - name: Build Windows 10+ x64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/agy-windows10-amd64.exe ./cmd/agy
      - name: Build Windows 10+ x86
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: "386"
          GO386: softfloat
        run: go build -trimpath -ldflags="-s -w" -o dist/agy-windows10-386.exe ./cmd/agy

      # Windows 7 builds use Go 1.20 and the compatibility module.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.20.14"
      - name: Build Windows 7 legacy x64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -mod=mod -modfile=go.windows7.mod -trimpath -ldflags="-s -w" -o dist/agy-windows7-amd64.exe ./cmd/agy
      - name: Build Windows 7 legacy x86
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: "386"
          GO386: softfloat
        run: go build -mod=mod -modfile=go.windows7.mod -trimpath -ldflags="-s -w" -o dist/agy-windows7-386.exe ./cmd/agy

      - uses: actions/upload-artifact@v4
        with:
          name: agy-windows10-amd64
          path: dist/agy-windows10-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agy-windows10-386
          path: dist/agy-windows10-386.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agy-windows7-amd64
          path: dist/agy-windows7-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agy-windows7-386
          path: dist/agy-windows7-386.exe

  linux-amd64:
    needs: windows-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Format, test and vet
        run: |
          go mod download
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
          go test ./...
          go vet ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agy ./cmd/agy
          ./dist/agy --version
          file dist/agy
          ldd dist/agy 2>&1 | grep -q "not a dynamic executable"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-linux-amd64
          path: dist/agy

      - name: Read release version
        id: release_version
        run: |
          version=$(grep -Eo 'const version = "[^"]+"' cmd/agy/main.go | cut -d'"' -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download Windows 10+ x64 executable
        uses: actions/download-artifact@v4
        with:
          name: agy-windows10-amd64
          path: dist

      - name: Download Windows 10+ x86 executable
        uses: actions/download-artifact@v4
        with:
          name: agy-windows10-386
          path: dist

      - name: Download Windows 7 x64 executable
        uses: actions/download-artifact@v4
        with:
          name: agy-windows7-amd64
          path: dist

      - name: Download Windows 7 x86 executable
        uses: actions/download-artifact@v4
        with:
          name: agy-windows7-386
          path: dist

      - name: Publish release
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: agy-open v${{ steps.release_version.outputs.version }}
          body: |
            agy-open v${{ steps.release_version.outputs.version }} is an independent terminal-first AI coding agent for Linux, written in Go.

            Highlights:
            - Gemini stream recovery retries recoverable transport interruptions without repeating already displayed text; cancellation stops retry backoff and response parsing.
            - Independent /verbose controls for tool results, NVIDIA thought summaries, and Gemini thought summaries; tool output is retained only in bounded session RAM (16 MiB per output, 64 MiB per session), never in session files or temporary spools.
            - Session isolation: /clear cancels active model, tool, shell, approval, and teamwork operations, rejects stale events/results, and blocks replacement prompts until the old run exits.
            - Explicit no-tools prompts omit tool schemas and reject unexpected tool calls; workspace repository instructions load only for repository-maintenance tasks.
            - The interactive TUI keeps its animated timer statusline below the streamed response and finishes with provider-measured input/output token deltas. Plain-text `agy -p` appends the same statusline after the answer in terminal output; JSON and redirected output remain clean.
            - Fixed duplicate credential-menu repaint and scheduler Escape overlay cleanup.
            - NVIDIA RPM and TPM limits are editable as the first entries in /config; a shared sliding-window limiter and bounded FIFO queue coordinate all Agy NVIDIA workers.
            - NVIDIA Retry-After handling, a TUI retry-on-429 switch, configurable maximum backoff, and a shared circuit pause reduce repeated 429 bursts.
            - Model-aware reasoning effort controls for API providers, with provider-specific request mapping for NVIDIA, Groq, OpenRouter, and OpenAI API.
            - Gemini Antigravity OAuth preserves manually entered model IDs verbatim; model names are never rewritten with an inferred medium/high/low tier.
            - API providers preserve each model's native reasoning default unless an explicit supported effort is selected; fixed and undocumented capabilities are not guessed.
            - Fixed scrollback/line-mode overlay selection parity: system-prompt profiles now apply on Enter, completion pickers accept selections, and read-only menus remain visible instead of disappearing.
            - Expanded cursor-aware TUI completions for MCP subcommands and configured server names, alongside role, system-prompt, model, effort, permissions, theme, plugin, session, recovery, and path suggestions.
            - Added optional Google Search grounding for Gemini Antigravity OAuth and Gemini Developer API, OFF by default, with grounded source links and Search suggestions on supported Gemini 3 models.
            - Added optional sampling-temperature control and a separate thought-output visibility switch; unset temperature and hidden thoughts preserve provider defaults and normal chat output.
            - Reworked TUI Configuration into nested groups with Escape-based back navigation, consistent Vim-style menu navigation, page scrolling, and fuzzy search.
            - Added cursor-aware slash-command and argument completion with typo-tolerant ranking and valid context-specific suggestions.
            - Added a lightweight streaming terminal Markdown renderer for headings, emphasis, lists, task lists, blockquotes, tables, fenced code, language-aware colors, and terminal-cell wrapping.
            - Added configurable TUI hotkeys through /config → Keyboard shortcuts, with /keybindings discovery, validation, collision detection, and explicit unbinding.
            - Added safer shell/editor terminal handoff: the input reader pauses, child processes receive terminal foreground ownership, and Agy restores terminal modes on return.
            - Enter and Ctrl+M are handled as the same submit event; Ctrl+S toggles mouse reporting in full-screen mode.

            - TUI shell command rows preserve actual multiline scripts; terminal escape sequences remain safely rendered as visible text.
            - Multiline prompt Up/Down keys move the cursor; Ctrl+P/Ctrl+N navigate command history independently in both TUI input modes.
            - Agent requests encourage batching independent inspections and stop identical repeated tool calls before re-execution.
            - Ten isolated providers: Google Antigravity OAuth, Gemini Developer API, Google AI Studio, Gemini Live, ChatGPT OAuth, OpenAI API, OpenAI-compatible local servers, OpenRouter, Groq, and NVIDIA API Catalog.
            - Gemini Developer API and AI Studio use the v1beta Interactions API with Gemini 3.8 Flash, native Code Execution, Google Search, URL Context, configured safety settings, and resumable local interaction history.
            - Gemini Live uses the required bidirectional Live API WebSocket transport; Live models are never sent to GenerateContent or Chat Completions.
            - One saved Google API key is shared by Gemini Developer API, AI Studio, and Gemini Live.
            - API-key changes in the TUI immediately refresh the active provider client; model discovery and inference use the saved key without a restart or duplicate login.
            - Groq API provider with live model discovery, namespaced groq:model-id selections, and Qwen 3.8 reasoning-effort mapping.
            - NVIDIA API Catalog provider with dedicated NVIDIA_API_KEY credentials, live /v1/models discovery, and namespaced nvidia:model-id selections.
            - OpenRouter model discovery and inference use the saved API key from the TUI credential manager.
            - Interactive TUI scheduler, natural-language agent-role generation, teamwork planning, and unlimited-by-default execution budgets.
            - Static Linux amd64 binary; model inference remains remote.

            Authentication:
            - Use /login for OAuth providers.
            - Save API keys in /config → Provider credentials, or provide them with agy login PROVIDER --with-api-key.
            - Keys are never embedded in the binary.
          files: |
            dist/agy
            dist/agy-windows10-amd64.exe
            dist/agy-windows10-386.exe
            dist/agy-windows7-amd64.exe
            dist/agy-windows7-386.exe
          generate_release_notes: true
          prerelease: false
