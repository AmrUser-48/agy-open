name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Prepare embedded Google OAuth client
        run: |
          src="${RUNNER_TEMP}/gemini-oauth2.ts"
          curl -fsSL https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/code_assist/oauth2.ts -o "$src"
          python3 - "$src" "$GITHUB_ENV" <<'PY'
import pathlib
import re
import sys

src = pathlib.Path(sys.argv[1]).read_text()
env = pathlib.Path(sys.argv[2])
client_id = re.search(r"const\s+OAUTH_CLIENT_ID\s*=\s*['"]([^'"]+)['"]", src, re.S)
client_secret = re.search(r"const\s+OAUTH_CLIENT_SECRET\s*=\s*['"]([^'"]+)['"]", src, re.S)
if not client_id or not client_secret:
    raise SystemExit("could not find Gemini CLI OAuth client")
with env.open("a") as f:
    f.write("AGY_OAUTH_CLIENT_ID=" + client_id.group(1) + "\n")
    f.write("AGY_OAUTH_CLIENT_SECRET=" + client_secret.group(1) + "\n")
PY
          test -n "$AGY_OAUTH_CLIENT_ID"
          test -n "$AGY_OAUTH_CLIENT_SECRET"

      - name: Format, test and vet
        run: |
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
          go test ./...
          go vet ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X github.com/AmrUser-48/agy-open/internal/auth.EmbeddedClientID=$AGY_OAUTH_CLIENT_ID -X github.com/AmrUser-48/agy-open/internal/auth.EmbeddedClientSecret=$AGY_OAUTH_CLIENT_SECRET" -o dist/agy ./cmd/agy

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-linux-amd64
          path: dist/agy

      - name: Publish v0.3.0 release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.sha }}
          name: agy-open v0.3.0
          body: |
            agy-open public CLI/TUI port for older Linux systems.

            Static Linux amd64 Go binary. Model inference is remote through Gemini.

            Google login:
            agy login

            No OAuth credential JSON file is required on the target machine.
          files: dist/agy
          generate_release_notes: true
