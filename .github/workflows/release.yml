name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Format, test and vet
        run: |
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
          go test ./...
          go vet ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agy ./cmd/agy
          ./dist/agy --version
          file dist/agy
          ldd dist/agy 2>&1 | grep -q "not a dynamic executable"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-linux-amd64
          path: dist/agy

      - name: Publish v0.5.0 release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          target_commitish: ${{ github.sha }}
          name: agy-open v0.5.0
          body: |
            agy-open independent Antigravity CLI/TUI port for older Linux systems.

This release uses the current Antigravity consumer OAuth and Code Assist transport.

            Static Linux amd64 Go binary. Model inference is remote through Gemini.

            Google login:
            agy login

            No OAuth credential JSON file is required on the target machine.
          files: dist/agy
          generate_release_notes: true
