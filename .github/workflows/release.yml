name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Format, test and vet
        run: |
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
          go test ./...
          go vet ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agy ./cmd/agy
          ./dist/agy --version
          file dist/agy
          ldd dist/agy 2>&1 | grep -q "not a dynamic executable"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-linux-amd64
          path: dist/agy

      - name: Read release version
        id: release_version
        run: |
          version=$(grep -Eo 'const version = "[^"]+"' cmd/agy/main.go | cut -d'"' -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: agy-open v${{ steps.release_version.outputs.version }}
          body: |
            agy-open v0.8.0 is an independent terminal-first AI coding agent for Linux, written in Go.

            Highlights:
            - Eight isolated providers: Google Antigravity OAuth, Gemini Developer API, Google AI Studio, Gemini Live, ChatGPT OAuth, OpenAI API, OpenAI-compatible local servers, and OpenRouter.
            - AI Studio Interactions API with native Code Execution, Google Search, and URL Context tools, plus resumable local session history.
            - Direct Gemini Live WebSocket provider with a dedicated Live model catalogue, text transcription output, and AGY-approved function execution.
            - Interactive TUI scheduler with one-time, delayed, recurring, named-event, and process-exit triggers; LLM or direct-program actions.
            - Natural-language agent-role generation with schema validation, review, and explicit save confirmation.
            - Unlimited-by-default agent turn, tool-call, and runtime budgets; explicit positive limits remain configurable.
            - Provider-specific API-key storage separated from Antigravity and ChatGPT OAuth credentials.
            - Static Linux amd64 binary; model inference remains remote.

            Authentication:
            - Run `agy login` for OAuth providers.
            - Configure API-key providers in `/config → Provider credentials` or with `agy login PROVIDER --with-api-key`.
            
            No API keys or OAuth credentials are embedded in this binary.
          files: dist/agy
          generate_release_notes: true
          prerelease: false
