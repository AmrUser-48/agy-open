[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-open"
version = "0.1.0"
description = "Open terminal-first AI coding agent inspired by the public Antigravity CLI workflow."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "agy-open contributors"}]
dependencies = []

[project.scripts]
agy = "agy_open.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
